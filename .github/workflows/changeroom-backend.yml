name: ChangeRoom backend
on:
  pull_request:
    paths: ['backend/**', 'database/**', 'scripts/ops/**', '.github/workflows/changeroom-backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'database/**', 'scripts/ops/**', '.github/workflows/changeroom-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crtest
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jobs_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - name: Test FastAPI and job settlement without external provider calls
        env:
          TRYON_TEST_DB_URL: postgresql://crtest:ci-only@127.0.0.1:5432/jobs_test
        run: python scripts/ops/offline_backend_tests.py
      - name: Verify operator refund reconciliation and protected health probes
        env:
          CHANGEROOM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: '127.0.0.1'
          PGUSER: crtest
          PGPASSWORD: ci-only
          CHANGEROOM_REFUND_TEST_DSN: postgresql://crtest:ci-only@127.0.0.1:5432/refund_test
        run: |
          createdb refund_test
          python -m pytest scripts/ops/tests -q
      - name: Verify migration prerequisites and rehearse recovery on a separate synthetic database
        env:
          PGPASSWORD: ci-only
          CHANGEROOM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: '127.0.0.1'
          PGUSER: crtest
        run: |
          createdb recovery_test
          python scripts/ops/recovery_drill.py --port 5432
  container:
    name: Linux subscriber worker container
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build only the subscriber FastAPI worker
        run: docker build --platform linux/amd64 --tag changeroom-worker:ci backend
      - name: Smoke-test the image without network or provider secrets
        run: bash scripts/ops/container_smoke.sh changeroom-worker:ci
